<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIPU · Registro de Taxis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-lipu:#1D9E75;
    --verde-oscuro:#0E5C42;
    --verde-claro:#EAF7F1;
    --naranja:#E8833A;
    --texto:#1F2A26;
    --gris:#6B7A75;
    --borde:#DCEAE3;
    --rojo:#D0483F;
    --sombra:0 6px 20px rgba(14,92,66,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',Arial,sans-serif;
    background:linear-gradient(180deg,#F4FAF7 0%,#EDF6F1 100%);
    color:var(--texto);
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}

  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand-id{display:flex;flex-direction:column;}
  .brand-id .co{font-size:11px;letter-spacing:.14em;color:var(--gris);text-transform:uppercase;font-weight:600;}
  .brand-id h1{margin:2px 0 0;font-size:22px;font-weight:800;color:var(--verde-oscuro);letter-spacing:-.01em;}
  .brand-mark{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--verde-lipu),var(--verde-oscuro));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:17px;flex-shrink:0;box-shadow:var(--sombra);
  }

  .tabs{display:flex;gap:8px;margin-bottom:20px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--sombra);}
  .tab-btn{
    flex:1;padding:12px 10px;border:none;border-radius:10px;background:transparent;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--gris);cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--verde-lipu);color:#fff;box-shadow:0 3px 10px rgba(29,158,117,.35);}
  .tab-btn:not(.active):hover{background:var(--verde-claro);}

  .card{background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:24px 22px;margin-bottom:16px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--verde-oscuro);margin-bottom:6px;}
  .field label .req{color:var(--rojo);margin-left:2px;}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--borde);border-radius:10px;
    font-family:inherit;font-size:14px;color:var(--texto);background:#FBFEFC;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--verde-lipu);background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.12);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 20px;border:none;border-radius:11px;font-family:inherit;
    font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;width:100%;
  }
  .btn-primary{background:var(--verde-lipu);color:#fff;box-shadow:0 4px 14px rgba(29,158,117,.32);}
  .btn-primary:hover{background:var(--verde-oscuro);}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}
  .btn-ghost{background:var(--verde-claro);color:var(--verde-oscuro);}
  .btn-ghost:hover{background:#DCF1E7;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}

  .msg{padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
  .msg-ok{background:#E6F8EE;color:var(--verde-oscuro);}
  .msg-err{background:#FCEBEA;color:var(--rojo);}

  /* Folio */
  .folio-box{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--verde-claro);border:1.5px dashed var(--verde-lipu);
    border-radius:12px;padding:12px 14px;margin-bottom:16px;
  }
  .folio-box .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gris);}
  .folio-box .val{font-size:20px;font-weight:800;color:var(--verde-oscuro);font-variant-numeric:tabular-nums;}
  .folio-box button{
    background:#fff;border:1.5px solid var(--verde-lipu);color:var(--verde-oscuro);
    border-radius:9px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  }

  /* Solicitudes */
  .list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .list-head .sub{font-size:12.5px;color:var(--gris);font-weight:600;}
  .list-head button{width:auto;padding:9px 15px;font-size:13px;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    border:1.5px solid var(--borde);background:#fff;color:var(--gris);
    border-radius:20px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .chip.on{background:var(--verde-oscuro);border-color:var(--verde-oscuro);color:#fff;}

  .rec{border:1.5px solid var(--borde);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .rec-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap;}
  .rec .folio{font-weight:800;font-size:13px;color:var(--verde-oscuro);letter-spacing:.02em;}
  .rec-info{font-size:13px;line-height:1.6;}
  .rec-info b{color:var(--verde-oscuro);}
  .rec-info .sub{color:var(--gris);}
  .rec-acciones{margin-top:10px;}
  .rec-acciones .btn{width:auto;padding:9px 15px;font-size:12.5px;}

  .badge{border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;}
  .badge.pend{background:#FFF1E0;color:#9A5B12;}
  .badge.ok{background:#E2F6EC;color:#0E5C42;}
  .badge.no{background:#FCE8E6;color:#A5322A;}

  .empty,.loading{text-align:center;color:var(--gris);font-size:13.5px;padding:26px 0;}
  .config-warning{
    background:#FFF4E5;border:1.5px solid #F3C98A;color:#8A5A15;
    padding:12px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;line-height:1.5;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-id">
      <span class="co">LIPU by TRAXION</span>
      <h1>Registro de Taxis</h1>
    </div>
    <div class="brand-mark">L</div>
  </div>

  <div id="configWarning" class="config-warning" style="display:none;">
    ⚠️ Falta configurar <code>CONFIG.API_URL</code> con la URL /exec de tu Web App de Apps Script.
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabNueva" onclick="cambiarTab('nueva')">Nueva solicitud</button>
    <button class="tab-btn" id="tabSolicitudes" onclick="cambiarTab('solicitudes')">Solicitudes</button>
  </div>

  <!-- ===== VISTA: FORMULARIO ===== -->
  <div class="card" id="vistaFormulario">
    <strong style="color:var(--verde-oscuro);font-size:15px;display:block;margin-bottom:14px;">Nueva solicitud</strong>

    <div id="msgArea"></div>

    <div class="folio-box" id="folioBox">
      <div>
        <div class="lbl">No. de reporte</div>
        <div class="val" id="folioTexto">Se asignará al enviar</div>
      </div>
      <button type="button" id="btnCopiarFolio" style="display:none;" onclick="copiarFolio()">Copiar</button>
    </div>

    <form id="taxiForm" onsubmit="return false;">
      <div class="field">
        <label>PLANTA <span class="req">*</span></label>
        <select id="f_planta" required><option value="">Selecciona…</option></select>
      </div>

      <div class="field">
        <label>Tipo de solicitud <span class="req">*</span></label>
        <select id="f_tipo" required><option value="">Selecciona…</option></select>
      </div>

      <div class="field">
        <label>Motivo de solicitud <span class="req">*</span></label>
        <textarea id="f_motivo" required></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label>Cantidad de taxis locales</label>
          <input type="number" min="0" id="f_locales">
        </div>
        <div class="field">
          <label>Cantidad de taxis foráneos</label>
          <input type="number" min="0" id="f_foraneos">
        </div>
      </div>

      <div class="field">
        <label>Ruta <span class="req">*</span></label>
        <input type="text" id="f_ruta" required>
      </div>

      <div class="row2">
        <div class="field">
          <label>Hora de Inicio <span class="req">*</span></label>
          <input type="time" id="f_horaInicio" required>
        </div>
        <div class="field">
          <label>Hora de Llegada <span class="req">*</span></label>
          <input type="time" id="f_horaLlegada" required>
        </div>
      </div>

      <div class="field">
        <label>Fecha de solicitud <span class="req">*</span></label>
        <input type="date" id="f_fecha" required>
      </div>

      <div class="field">
        <label>Usuarios</label>
        <input type="text" id="f_usuarios">
      </div>

      <div class="field">
        <label>Operador <span class="req">*</span></label>
        <input type="text" id="f_operador" required>
      </div>

      <div class="field">
        <label>Inplant que solicita <span class="req">*</span></label>
        <select id="f_inplant" required><option value="">Selecciona…</option></select>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnEnviar" onclick="enviarFormulario()">Enviar solicitud</button>
      </div>
    </form>
  </div>

  <!-- ===== VISTA: SOLICITUDES (solo lectura) ===== -->
  <div class="card" id="vistaSolicitudes" style="display:none;">
    <div class="list-head">
      <div>
        <strong style="color:var(--verde-oscuro);font-size:15px;">Solicitudes</strong>
        <div class="sub" id="rangoTexto">Ayer y hoy</div>
      </div>
      <button class="btn btn-ghost" onclick="cargarRegistros()">Actualizar</button>
    </div>

    <div class="chips" id="chipsStatus">
      <button class="chip on" data-st="TODOS" onclick="filtrarStatus('TODOS')">Todas</button>
      <button class="chip" data-st="Pendiente" onclick="filtrarStatus('Pendiente')">Pendientes</button>
      <button class="chip" data-st="Autorizado" onclick="filtrarStatus('Autorizado')">Autorizadas</button>
      <button class="chip" data-st="Rechazado" onclick="filtrarStatus('Rechazado')">Rechazadas</button>
    </div>

    <div class="field">
      <input type="text" id="buscador" placeholder="Buscar por folio, planta, operador, ruta…" oninput="renderLista()">
    </div>

    <div id="listaRegistros"><div class="loading">Cargando solicitudes…</div></div>
  </div>

</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxn_foY9yjp-hOMN-RzF-NP_cdC3EvLp-kPNdg2T0S5TflgjTWYaaoL3n_4RYC-XcZPMw/exec'
};

const CAMPO_FOLIO   = 'No. de reporte';
const CAMPO_STATUS  = 'Status';
const CAMPO_GERENTE = 'Gerente que autoriza';
const CAMPO_FECHA_AUT = 'Fecha de autorizacion';

const OPCIONES_PLANTA = [
  'CAMIONES','MOTORES NORTE','EXTENSION','VAN','MOTORES SUR','ISRINGHAUSEN',
  'BORGWARNER RAMOS','SABRITAS SALTILLO','METALSA','DEACERO PLANTA SALTILLO',
  'ALPHABET','HOLCIM','CINSA','BOCAR','DRAXTON SALTILLO','MIXING','SANTA ANITA',
  'HI-LEX','OMNISOURCE','MONTE BLANCO','FHERER','LAZ BOY'
];
const OPCIONES_TIPO = ['Conciliacion','Cargo Operador','Cargo Lipu','Falla Mecanica'];
const OPCIONES_INPLANT = [
  'Ana Karen Aguilera','Estefanía Cuellar','Cyndi Rodriguez','Manuel Hernandez',
  'Adrian Morales','Sharon de la Rosa','Kelly Luna','Melissa Rodriguez',
  'Selena Rodriguez','Daniela Valdes','Arisbet Mendoza','Michell Lopez',
  'Aby Carrizalez','Mayte Dávila','Alejandra Aradillas','Aby Coprpus',
  'Alejandra Cortez','Lluvia Hernandez','Ely Hernández','Alexis Lopez',
  'Nallely Cepeda','Verlinda Gatica','Estefanía Galán'
];

/* ============ ESTADO ============ */
let folioActual = '';
let registrosCache = [];
let filtroStatus = 'TODOS';

/* ============ INIT ============ */
function poblarSelect(id, opciones){
  const sel = document.getElementById(id);
  opciones.forEach(op=>{
    const o = document.createElement('option');
    o.value = op; o.textContent = op;
    sel.appendChild(o);
  });
}
poblarSelect('f_planta', OPCIONES_PLANTA);
poblarSelect('f_tipo', OPCIONES_TIPO);
poblarSelect('f_inplant', OPCIONES_INPLANT);

if (!CONFIG.API_URL || CONFIG.API_URL.includes('PEGA_AQUI')){
  document.getElementById('configWarning').style.display = 'block';
}

/* ============ TABS ============ */
function cambiarTab(tab){
  const esNueva = tab === 'nueva';
  document.getElementById('tabNueva').classList.toggle('active', esNueva);
  document.getElementById('tabSolicitudes').classList.toggle('active', !esNueva);
  document.getElementById('vistaFormulario').style.display = esNueva ? 'block' : 'none';
  document.getElementById('vistaSolicitudes').style.display = esNueva ? 'none' : 'block';
  if (!esNueva) cargarRegistros();
}

/* ============ FOLIO ============ */
function mostrarFolio(valor){
  folioActual = valor || '';
  const box = document.getElementById('folioBox');
  document.getElementById('folioTexto').textContent = folioActual || 'Se asignará al enviar';
  document.getElementById('folioTexto').style.opacity = folioActual ? '1' : '.55';
  document.getElementById('btnCopiarFolio').style.display = folioActual ? 'inline-block' : 'none';
  box.style.borderStyle = folioActual ? 'solid' : 'dashed';
}

function copiarFolio(){
  if (!folioActual) return;
  const btn = document.getElementById('btnCopiarFolio');
  const ok = ()=>{ btn.textContent='¡Copiado!'; setTimeout(()=>btn.textContent='Copiar',1500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(folioActual).then(ok).catch(()=>{});
  } else {
    const ta=document.createElement('textarea');
    ta.value=folioActual; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    document.body.removeChild(ta);
  }
}

/* ============ ENVÍO ============ */
function leerFormulario(){
  return {
    'PLANTA': document.getElementById('f_planta').value,
    'Tipo de solicitud': document.getElementById('f_tipo').value,
    'Motivo de solicitud': document.getElementById('f_motivo').value.trim(),
    'Cantidad de taxis locales': document.getElementById('f_locales').value,
    'Cantidad de taxis foraneos': document.getElementById('f_foraneos').value,
    'Ruta': document.getElementById('f_ruta').value.trim(),
    'Hora de Inicio': document.getElementById('f_horaInicio').value,
    'Hora de Llegada': document.getElementById('f_horaLlegada').value,
    'Fecha de solicitud': document.getElementById('f_fecha').value,
    'Usuarios': document.getElementById('f_usuarios').value.trim(),
    'Operador': document.getElementById('f_operador').value.trim(),
    'Inplant que solicita': document.getElementById('f_inplant').value
  };
}

function validar(data){
  const req = ['PLANTA','Tipo de solicitud','Motivo de solicitud','Ruta','Hora de Inicio',
               'Hora de Llegada','Fecha de solicitud','Operador','Inplant que solicita'];
  return req.every(k => String(data[k]||'').trim() !== '');
}

async function enviarFormulario(){
  const msgArea = document.getElementById('msgArea');
  msgArea.innerHTML = '';

  if (!CONFIG.API_URL || CONFIG.API_URL.includes('PEGA_AQUI')){
    msgArea.innerHTML = '<div class="msg msg-err">Falta configurar la URL del Web App (CONFIG.API_URL).</div>';
    return;
  }

  const data = leerFormulario();
  if (!validar(data)){
    msgArea.innerHTML = '<div class="msg msg-err">Completa todos los campos obligatorios (*).</div>';
    return;
  }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  try{
    const res = await fetch(CONFIG.API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'create', data })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error || 'Error al guardar');

    mostrarFolio(result.folio || '');
    msgArea.innerHTML = '<div class="msg msg-ok">Solicitud enviada correctamente.<br>'
      + 'No. de reporte: <b>'+escapeHtml(result.folio||'')+'</b> · Status: <b>Pendiente</b><br>'
      + 'El comprobante podrá descargarse desde la pestaña <b>Solicitudes</b> una vez autorizada.</div>';

    document.getElementById('taxiForm').reset();
    registrosCache = [];
  }catch(err){
    msgArea.innerHTML = '<div class="msg msg-err">No se pudo guardar: '+escapeHtml(err.message)+'</div>';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Enviar solicitud';
  }
}

/* ============ SOLICITUDES ============ */
async function cargarRegistros(){
  const cont = document.getElementById('listaRegistros');
  cont.innerHTML = '<div class="loading">Cargando solicitudes…</div>';
  try{
    const res = await fetch(CONFIG.API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error al cargar');
    registrosCache = (data.rows || []).filter(esAyerUHoy);
    renderLista();
  }catch(err){
    cont.innerHTML = '<div class="msg msg-err">No se pudo conectar con la hoja. ('+escapeHtml(err.message)+')</div>';
  }
}

/** Solo registros del día anterior y del día corriente (por Marca temporal). */
function esAyerUHoy(r){
  const f = fechaDeRegistro(r);
  if (!f) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const ayer = new Date(hoy); ayer.setDate(ayer.getDate()-1);
  return f >= ayer;
}

function fechaDeRegistro(r){
  const crudo = r['Marca temporal'] || r['Fecha de solicitud'] || '';
  const m = String(crudo).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const m2 = String(crudo).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); // d/m/aaaa
  if (m2) return new Date(+m2[3], +m2[2]-1, +m2[1]);
  const d = new Date(crudo);
  if (!isNaN(d)) { d.setHours(0,0,0,0); return d; }
  return null;
}

function statusDe(r){
  const s = String(r[CAMPO_STATUS]||'').trim();
  return s || 'Pendiente';
}

function filtrarStatus(st){
  filtroStatus = st;
  document.querySelectorAll('#chipsStatus .chip').forEach(c=>{
    c.classList.toggle('on', c.dataset.st === st);
  });
  renderLista();
}

function renderLista(){
  const cont = document.getElementById('listaRegistros');
  const q = document.getElementById('buscador').value.toLowerCase();

  let regs = registrosCache.slice();
  if (filtroStatus !== 'TODOS') regs = regs.filter(r => statusDe(r) === filtroStatus);
  if (q) regs = regs.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));

  if (!regs.length){
    cont.innerHTML = '<div class="empty">Sin solicitudes de ayer ni de hoy con ese filtro.</div>';
    return;
  }

  cont.innerHTML = '';
  regs.reverse().forEach(r=>{
    const st = statusDe(r);
    const cls = st === 'Autorizado' ? 'ok' : (st === 'Rechazado' ? 'no' : 'pend');
    const div = document.createElement('div');
    div.className = 'rec';
    div.innerHTML = `
      <div class="rec-top">
        <span class="folio">${escapeHtml(r[CAMPO_FOLIO]||'—')}</span>
        <span class="badge ${cls}">${escapeHtml(st)}</span>
      </div>
      <div class="rec-info">
        <b>${escapeHtml(r['PLANTA']||'—')}</b> · ${escapeHtml(r['Tipo de solicitud']||'—')}<br>
        <span class="sub">
          ${escapeHtml(r['Fecha de solicitud']||'—')} · ${escapeHtml(r['Hora de Inicio']||'—')}–${escapeHtml(r['Hora de Llegada']||'—')}<br>
          Ruta: ${escapeHtml(r['Ruta']||'—')} · Operador: ${escapeHtml(r['Operador']||'—')}<br>
          Solicita: ${escapeHtml(r['Inplant que solicita']||'—')}
          ${r[CAMPO_GERENTE] ? ' · Autoriza: '+escapeHtml(r[CAMPO_GERENTE]) : ''}
        </span>
      </div>
      <div class="rec-acciones"></div>
    `;
    const acc = div.querySelector('.rec-acciones');
    if (st === 'Autorizado'){
      const b = document.createElement('button');
      b.className = 'btn btn-primary';
      b.textContent = '⬇ Descargar comprobante';
      b.onclick = ()=>generarImagenComprobante(r);
      acc.appendChild(b);
    } else {
      acc.remove();
    }
    cont.appendChild(div);
  });
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ IMAGEN DE COMPROBANTE ============ */
function wrapText(ctx, text, maxWidth){
  const words = String(text||'-').split(' ');
  const lines = [];
  let current = '';
  words.forEach(w=>{
    const test = current ? current+' '+w : w;
    if (ctx.measureText(test).width > maxWidth && current){ lines.push(current); current = w; }
    else { current = test; }
  });
  if (current) lines.push(current);
  return lines;
}

function generarImagenComprobante(data){
  const etiquetas = [
    [CAMPO_FOLIO,'No. de reporte'],
    [CAMPO_STATUS,'Status'],
    [CAMPO_GERENTE,'Autorizado por'],
    [CAMPO_FECHA_AUT,'Fecha de autorización'],
    ['PLANTA','PLANTA'],
    ['Tipo de solicitud','Tipo de solicitud'],
    ['Motivo de solicitud','Motivo de solicitud'],
    ['Cantidad de taxis locales','Taxis locales'],
    ['Cantidad de taxis foraneos','Taxis foráneos'],
    ['Ruta','Ruta'],
    ['Hora de Inicio','Hora de inicio'],
    ['Hora de Llegada','Hora de llegada'],
    ['Fecha de solicitud','Fecha de solicitud'],
    ['Usuarios','Usuarios'],
    ['Operador','Operador'],
    ['Inplant que solicita','Inplant que solicita']
  ];

  const width = 720, marginX = 28, labelW = 220;
  const valueW = width - marginX*2 - labelW - 10;
  const headerH = 118, rowPadV = 14, lineH = 18;

  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = '13px Arial';

  const rows = etiquetas.map(([key,label])=>{
    const value = (data[key] !== undefined && data[key] !== '') ? String(data[key]) : '-';
    const lines = wrapText(mctx, value, valueW);
    return { label, lines: lines.length ? lines : ['-'] };
  });

  const rowHeights = rows.map(r => Math.max(lineH, r.lines.length*lineH) + rowPadV);
  const height = headerH + rowHeights.reduce((a,b)=>a+b,0) + 34;

  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,width,height);

  const grad = ctx.createLinearGradient(0,0,width,0);
  grad.addColorStop(0,'#1D9E75');
  grad.addColorStop(1,'#0E5C42');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,headerH);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('LIPU by TRAXION', marginX, 42);
  ctx.font = '15px Arial';
  ctx.fillText('Comprobante · Solicitud autorizada', marginX, 66);
  ctx.font = '12.5px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Descargado: '+new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}), marginX, 90);

  const folioTxt = String(data[CAMPO_FOLIO]||'');
  if (folioTxt){
    ctx.textAlign = 'right';
    ctx.font = '11.5px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('NO. DE REPORTE', width-marginX, 44);
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(folioTxt, width-marginX, 68);
    ctx.textAlign = 'left';
  }

  let y = headerH;
  rows.forEach((r, i)=>{
    const h = rowHeights[i];
    if (i % 2 === 0){ ctx.fillStyle = '#F4FAF7'; ctx.fillRect(0, y, width, h); }
    const textY = y + rowPadV/2 + lineH*0.72;
    ctx.fillStyle = '#0E5C42';
    ctx.font = 'bold 13px Arial';
    ctx.fillText(r.label, marginX, textY);
    ctx.fillStyle = '#333333';
    ctx.font = '13px Arial';
    r.lines.forEach((line, li)=>{ ctx.fillText(line, marginX + labelW, textY + li*lineH); });
    y += h;
  });

  ctx.fillStyle = '#E8833A';
  ctx.fillRect(0, height-6, width, 6);

  const link = document.createElement('a');
  const folioArchivo = String(data[CAMPO_FOLIO]||'').replace(/[^A-Za-z0-9\-]/g,'');
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');
  link.download = folioArchivo ? (folioArchivo+'.png') : ('registro_taxi_'+stamp+'.png');
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
</body>
</html>
